<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Dino</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 40px 25px;
      text-align: center;
      color: white;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }
    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: white;
      color: #667eea;
    }
    h1 { margin: 0 0 10px; font-size: 36px; }
    p { font-size: 17px; line-height: 1.6; margin-bottom: 25px; }
    button {
      border: 0;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #667eea;
    }
    button:active { transform: scale(0.96); }
    #pesan { margin-top: 18px; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">😎</div>
    <h1>Halo, aku Dino!</h1>
    <p>Selamat datang di website pribadiku 🚀<br>
    Aku sedang belajar membuat website.</p>
    <button onclick="sapa()">Klik Aku ✨</button>
    <div id="pesan"></div>
  </div>

  <script>
    function sapa() {
      document.getElementById("pesan").textContent = "Makasih udah mampir! 🔥";
    }
  </script>
</body>
</html>
